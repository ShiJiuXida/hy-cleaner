[versions]
agp = "9.2.1"              # 实测可构建；google maven 稳定线已到 9.5.1
kotlin = "2.4.10"          # AGP 9 内置 Kotlin，版本由 compose 插件对齐
compose = "1.11.1"
activity = "1.13.0"
xposed-api = "102.0.0"
xposed-service = "102.0.0"   # Maven Central 只有 101.0.0 / 102.0.0，没有 102.0.1

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# 注意：AGP 9.x 内置 Kotlin，不要再引入 org.jetbrains.kotlin.android
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "compose" }

[libraries]
libxposed-api = { module = "io.github.libxposed:api", version.ref = "xposed-api" }
libxposed-service = { module = "io.github.libxposed:service", version.ref = "xposed-service" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version = "2.11.0" }

